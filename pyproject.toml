[project]
name = "trident-application"
version = "0.1.0"
description = "TRIDENT web application (Streamlit) for predicting acute/chronic chemical ecotoxicity from SMILES. Inference/serving only."
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "torch==2.1.2",
    "streamlit==1.61.1",
    "transformers==4.36.2",
    "pandas==2.1.4",
    "numpy==1.26.3",
    "rdkit==2022.03.5",
    "scikit-learn==1.3.2",
    "plotly==5.18.0",
    "umap-learn==0.5.5",
    "stqdm==0.0.5",
    "openpyxl==3.1.2",
    "loguru==0.7.2",
    "httpx==0.28.1",
    "python-dotenv==1.0.1",
]

[tool.uv]
package = false

